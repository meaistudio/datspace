<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator Link Undangan</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 32px 20px 60px;
        background: #000;
        color: #fff;
        font-family: 'Pixelify Sans', monospace;
        display: flex;
        justify-content: center;
    }
    .wrap { width: 100%; max-width: 560px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p.sub { color: rgba(255,255,255,.7); font-size: 13px; margin: 0 0 28px; line-height: 1.5; }
    label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .02em;
        margin-bottom: 6px;
    }
    input[type=text], textarea {
        width: 100%;
        background: #000;
        border: 2px solid #fff;
        color: #fff;
        font-family: 'Pixelify Sans', monospace;
        font-size: 14px;
        padding: 10px 12px;
        border-radius: 0;
    }
    textarea { resize: vertical; min-height: 160px; line-height: 1.6; }
    .field { margin-bottom: 20px; }
    button {
        background: #fff;
        color: #000;
        border: none;
        font-family: 'Pixelify Sans', monospace;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: .03em;
        padding: 12px 22px;
        cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    button.ghost {
        background: transparent;
        color: #fff;
        border: 2px solid #fff;
        font-size: 12px;
        padding: 7px 12px;
        font-weight: 600;
    }
    .results {
        margin-top: 30px;
        border-top: 2px solid rgba(255,255,255,.25);
        padding-top: 18px;
    }
    .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255,255,255,.15);
        font-size: 13px;
    }
    .row .name { width: 130px; flex: none; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .link {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: rgba(255,255,255,.75);
    }
    .row button { flex: none; padding: 5px 10px; font-size: 11px; }
    .toprow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        gap: 10px;
        flex-wrap: wrap;
    }
    .empty { color: rgba(255,255,255,.5); font-size: 13px; padding: 20px 0; }
    .copied { color: #7CFC9C; }
</style>
</head>
<body>
<div class="wrap">
    <h1>Generator Link Undangan</h1>
    <p class="sub">Tempel URL undangan yang sudah online, lalu daftar nama tamu (satu nama per baris). Setiap nama akan otomatis jadi link personal <code>?to=Nama</code> yang mengisi blank &ldquo;Hi ___&rdquo;.</p>

    <div class="field">
        <label for="baseUrl">URL Undangan (setelah di-upload/online)</label>
        <input type="text" id="baseUrl" placeholder="https://domainkamu.com/index.html" value="https://datspace.club/DATs_Out/DATs_Out4/invitation/index.html">
    </div>

    <div class="field">
        <label for="names">Daftar Nama (satu per baris)</label>
        <textarea id="names" placeholder="Budi Santoso&#10;Siti Aminah&#10;Kevin Tanoto&#10;..."></textarea>
    </div>

    <button onclick="generate()">Buat Semua Link</button>

    <div class="results" id="results">
        <div class="empty">Belum ada link dibuat.</div>
    </div>
</div>

<script>
function generate() {
    var base = document.getElementById("baseUrl").value.trim() || "index.html";
    var raw = document.getElementById("names").value;
    var names = raw.split("\n").map(function (n) { return n.trim(); }).filter(Boolean);
    var out = document.getElementById("results");

    if (!names.length) {
        out.innerHTML = '<div class="empty">Masukkan minimal satu nama.</div>';
        return;
    }

    var sep = base.indexOf("?") === -1 ? "?" : "&";
    var links = names.map(function (name) {
        return { name: name, url: base + sep + "to=" + encodeURIComponent(name) };
    });

    var html = '<div class="toprow"><span style="font-size:12px;color:rgba(255,255,255,.6)">' + links.length + ' link dibuat</span>' +
        '<button class="ghost" onclick="copyAll()">Copy Semua (Nama: Link)</button></div>';

    links.forEach(function (l, i) {
        html += '<div class="row">' +
            '<span class="name">' + escapeHtml(l.name) + '</span>' +
            '<span class="link" id="link' + i + '">' + escapeHtml(l.url) + '</span>' +
            '<button onclick="copyOne(' + i + ', this)">Copy</button>' +
            '</div>';
    });

    out.innerHTML = html;
    window.__links = links;
}

function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function copyOne(i, btn) {
    var link = window.__links[i];
    navigator.clipboard.writeText(link.url).then(function () {
        var old = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(function () { btn.textContent = old; }, 1200);
    });
}

function copyAll() {
    var text = window.__links.map(function (l) { return l.name + ": " + l.url; }).join("\n");
    navigator.clipboard.writeText(text).then(function () {
        var btn = document.querySelector(".ghost");
        var old = btn.textContent;
        btn.textContent = "Tersalin!";
        setTimeout(function () { btn.textContent = old; }, 1200);
    });
}
</script>
</body>
</html>
