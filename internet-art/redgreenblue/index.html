<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Green Blue</title>

<style>
html, body{
    margin:0;
    background:#ccc; /* Warna latar abu-abu asli bawaan Anda */
    overflow:hidden;
    font-family: monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    height:100%;
}

#stage{ position:fixed; inset:0; width:100vw; height:100vh; display:block; cursor:crosshair; }
#stage.grab{ cursor:grabbing; }

/* TOMBOL KONEKSI STEALTH - ICON USB TRANSPARAN */
#connectBtn {
    position: fixed;
    top: calc(20px + env(safe-area-inset-top, 0px));
    left: 20px;
    width: 50px;
    height: 50px;
    background: rgba(200, 200, 200, 0.4);
    border: 2px solid #ff00ff;
    border-radius: 50%;
    cursor: pointer;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    opacity: 0; /* Tersembunyi rapi di awal */
    mix-blend-mode: difference;
    transition: opacity 0.4s ease, transform 0.2s ease, box-shadow 0.3s ease;
}
/* Memancar ungu-hijau cerah saat kursor mouse mendekat */
#connectBtn:hover, #connectBtn:focus-visible {
    opacity: 1;
    transform: scale(1.05);
    box-shadow: 0 0 15px #9eeb34;
    outline: none;
}
#connectBtn svg { width: 26px; height: 26px; fill: #ff00ff; }

/* HUD NOTIFIKASI STATUS */
#hudStatus {
    position: fixed;
    bottom: calc(15px + env(safe-area-inset-bottom, 0px));
    left: 20px;
    right: 20px;
    color: #ff00ff;
    font-size: 11px;
    mix-blend-mode: difference;
    letter-spacing: 1px;
    pointer-events: none;
    z-index: 999;
    line-height: 1.5;
}

/* PANEL ENCODER VIRTUAL (MODE TANPA ALAT) */
#panel{
    position: fixed;
    right: 16px;
    bottom: calc(44px + env(safe-area-inset-bottom, 0px));
    z-index: 1000;
    width: 210px;
    color: #ff00ff;
    font-size: 10px;
    letter-spacing: 1px;
    mix-blend-mode: difference;
    transition: opacity .3s ease;
}
#panel.hide{ opacity:0; pointer-events:none; }
#panel .row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
#panel .row span{ width:58px; }
#panel .row b{ width:22px; text-align:right; font-weight:normal; }
#panel input[type=range]{
    flex:1; -webkit-appearance:none; appearance:none; height:3px; background:#ff00ff; margin:0;
}
#panel input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; background:#9eeb34; border:0; border-radius:0; cursor:pointer; }
#panel input[type=range]::-moz-range-thumb{ width:14px; height:14px; background:#9eeb34; border:0; border-radius:0; cursor:pointer; }
#keypad{ display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; }
#keypad button{
    font: 11px monospace; color:#ff00ff; background:transparent; border:1px solid #ff00ff;
    padding:7px 0; cursor:pointer; letter-spacing:0;
}
#keypad button.on{ background:#9eeb34; color:#000; border-color:#9eeb34; }
#keypad button:focus-visible{ outline:2px solid #9eeb34; }

#hideBtn{
    position: fixed; right: 16px; bottom: calc(15px + env(safe-area-inset-bottom, 0px)); z-index:1001;
    font: 10px monospace; letter-spacing:1px; color:#ff00ff; background:transparent; border:0; cursor:pointer;
    mix-blend-mode: difference; padding: 2px 0;
}

@media (max-width: 560px){
    #hudStatus{ right: 90px; font-size:10px; }
    #panel{ width: calc(100vw - 32px); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    #keypad{ grid-template-columns:repeat(8, 1fr); }
}
</style>
</head>

<body>

<canvas id="stage"></canvas>

<button id="connectBtn" title="Hubungkan Alat DATs" aria-label="Hubungkan Alat DATs">
    <svg viewBox="0 0 24 24">
        <path d="M19 9h-3V7h1V3h-4v4h1v2h-3v2.59L7.41 12l.71-1.41-1.42-1.42L4 12.5l1.83 3.66 1.42-1.42-1.11-1.11 2.45-1.22V15h-1v4h4v-4h-1v-2.59L19 12.5V9zm-3-4h1v1h-1V5zm-4 0h1v1h-1V5z"/>
    </svg>
</button>

<div id="panel">
    <div class="row"><span>ENC A</span><input id="encA" type="range" min="1" max="100" value="30" aria-label="Encoder A speed"><b id="encAv">30</b></div>
    <div class="row"><span>ENC B</span><input id="encB" type="range" min="5" max="95" value="60" aria-label="Encoder B blocks"><b id="encBv">60</b></div>
    <div id="keypad"></div>
</div>
<button id="hideBtn">[H] HIDE</button>

<div id="hudStatus">DATs RUNNING // STANDALONE MODE</div>

<script>
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
const hud = document.getElementById("hudStatus");
const panel = document.getElementById("panel");
const encA = document.getElementById("encA"), encB = document.getElementById("encB");
const encAv = document.getElementById("encAv"), encBv = document.getElementById("encBv");

// Layer balok terpisah, supaya efek 4 (trail) tidak ikut menumpuk garis difference
const layer = document.createElement("canvas");
const lctx = layer.getContext("2d");

// Parameter Default Sinkronisasi Alat DATs
let datsVal1 = 30;         // Encoder A -> Speed Control
let datsVal2 = 60;         // Encoder B -> Jumlah Balok Aktif
let activeEffect = '1';    // Default Efek Normal (1-9)
let deviceLinked = false;

const MAX_POOL = 95;       // Pool kapasitas maksimum objek di memori
const BLOCK = 120;
const CAPPED = ['4', '5', '7', '9'];
const FX_NAMES = {
    '1': 'NORMAL DRIFT', '2': 'RISING STREAM', '3': 'PULSE', '4': 'FEEDBACK TRAIL',
    '5': 'ROTATING MATRIX', '6': 'GHOST LINK', '7': 'BLOOM FEEDBACK',
    '8': 'STAGGERED INWARD TUNNEL', '9': 'SOLID VORTEX'
};

let blockData = [];
let purpleLines = [];
let globalTime = 0;        // Waktu linear konstan bebas (Efek 1, 2, 3, 6, 8)
let fxTime = 0;            // Waktu yang dikunci maks speed 30 (Efek 4, 5, 7, 9)
let W = 0, H = 0, DPR = 1;
let regenFlash = 0;
let vortexAngle = 0;       // sudut putar efek 9, dipakai untuk drag

/* ==========================================
   REAKSI BERANTAI
   Balok i terhubung ke i-1 dan i+1 lewat garis hijau.
   Sinyal merambat di garis itu; setiap balok yang dilewati menyala,
   membesar, terdorong, lalu meneruskan sinyal ke tetangganya.
   ========================================== */
let pulses = [];
let ambientT = 2;
const PULSE_SPEED = 9;     // balok per detik

function hit(i, s){
    const d = blockData[i];
    if (!d) return;
    d.react = Math.min(1.2, Math.max(d.react, s));
    const a = Math.random() * Math.PI * 2;
    d.vx += Math.cos(a) * 260 * s;
    d.vy += Math.sin(a) * 260 * s;
}
function spawnPulse(i, s = 1){
    if (pulses.length > 40) pulses.splice(0, pulses.length - 40);
    pulses.push({ p: i, dir: 1, s });
    pulses.push({ p: i, dir: -1, s });
    hit(i, s);
}
function activeCount(){ return Math.max(5, Math.min(MAX_POOL, Math.floor(datsVal2))); }

function rand(min,max){ return Math.random()*(max-min)+min; }

/* ==========================================
   UKURAN LAYAR
   ========================================== */
function resize(){
    const oldW = W || window.innerWidth, oldH = H || window.innerHeight;
    W = window.innerWidth; H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    for (const c of [cv, layer]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    cv.style.width = W + "px"; cv.style.height = H + "px";
    // Pertahankan komposisi saat layar berubah ukuran
    for (const d of blockData) { d.x *= W / oldW; d.y *= H / oldH; }
    for (const l of purpleLines) l.pos *= (l.v ? W / oldW : H / oldH);
    lctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    lctx.fillStyle = "#ccc"; lctx.fillRect(0, 0, W, H);
}

/* ==========================================
   SPRITE GLOW (dibuat sekali, dipakai semua balok)
   Gradasi radial asli: putih di tengah ke merah transparan, blur 3px
   ========================================== */
const glowSprite = document.createElement("canvas");
(function makeGlow(){
    const S = 2;                       // resolusi 2x agar tetap tajam saat di-zoom
    glowSprite.width = glowSprite.height = 140 * S;
    const g = glowSprite.getContext("2d");
    g.scale(S, S);
    const r = Math.hypot(70, 70);      // radial-gradient(circle) = farthest-corner
    const grad = g.createRadialGradient(70, 70, 0, 70, 70, r);
    grad.addColorStop(0.00, "rgba(255,255,255,1)");
    grad.addColorStop(0.35, "rgba(255,255,255,1)");
    grad.addColorStop(0.50, "rgba(255,180,180,0.9)");
    grad.addColorStop(0.65, "rgba(255,0,0,0.7)");
    grad.addColorStop(0.80, "rgba(255,0,0,0.25)");
    grad.addColorStop(1.00, "rgba(255,0,0,0)");
    try { g.filter = "blur(3px)"; } catch (e) {}
    g.fillStyle = grad;
    g.beginPath(); g.roundRect ? g.roundRect(0, 0, 140, 140, 7) : g.rect(0, 0, 140, 140); g.fill();
})();

/* ==========================================
   INITIAL GENERATION POOL (LANGSUNG LOADING)
   ========================================== */
function generateStructure(){
    blockData = [];
    purpleLines = [];

    // 1. Pool Unit Balok Merah
    for(let i=0; i<MAX_POOL; i++){
        blockData.push({
            x: Math.random() * W,
            y: Math.random() * H,
            baseScale: 0.1 + Math.random() * 0.6,
            tOffset: Math.random() * 100,
            driftY: rand(-0.4, -0.1),
            driftX: rand(-0.2, 0.2),
            rotOffset: Math.random() * 360,
            sx: 0, sy: 0, sScale: 1, // posisi layar terakhir (untuk drag)
            react: 0, ox: 0, oy: 0, vx: 0, vy: 0 // energi reaksi + pegas
        });
    }

    // 2. 8 Garis Ungu Statis Bawaan Anda (lebar 100px)
    const TOTAL_LINES = 8;
    for(let i=0; i<TOTAL_LINES; i++){
        const v = Math.random() > 0.5;
        purpleLines.push({ v, pos: Math.random() * (v ? W : H) });
    }

    regenFlash = 1;
    pulses = [];
    if (W) spawnPulse(Math.floor(Math.random() * activeCount()), 1);
}

/* ==========================================
   AMBIENT MAIN ANIMATION LOOP (FLUID SYSTEM)
   ========================================== */
let last = performance.now();
let dragging = null, dragIndex = -1;

function animationEngine(now){
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const step = dt * 60;              // 1.0 pada 60fps, supaya kecepatan sama di layar 120Hz

    // Kecepatan normal global dari Encoder A
    const speedMultiplier = (datsVal1 / 30);
    globalTime += speedMultiplier * 0.015 * step;

    // Batasi Kecepatan Maksimal = 30 Khusus Efek 4, 5, 7, 9
    const isCappedFX = CAPPED.includes(activeEffect);
    const currentSpeed = isCappedFX ? Math.min(1.0, speedMultiplier) : speedMultiplier;
    fxTime += currentSpeed * 0.015 * step;

    // Batas jumlah tampilan balok diatur dinamis via Encoder B
    const maxActiveBlocks = Math.max(5, Math.min(MAX_POOL, Math.floor(datsVal2)));
    const activeCoordinates = [];

    const centerX = W / 2;
    const centerY = H / 2;

    // PEGAS & ENERGI: balok yang terdorong kembali ke tempatnya, nyalanya meredup
    const damp = Math.exp(-5 * dt), fade = Math.exp(-2.2 * dt);
    for (let i = 0; i < maxActiveBlocks; i++) {
        const d = blockData[i];
        d.vx += -d.ox * 90 * dt; d.vy += -d.oy * 90 * dt;
        d.vx *= damp; d.vy *= damp;
        d.ox += d.vx * dt; d.oy += d.vy * dt;
        d.react *= fade;
    }

    // SINYAL MERAMBAT: tiap melewati balok, balok itu bereaksi dan sinyal sedikit melemah
    const pace = Math.min(2.5, Math.max(0.4, currentSpeed));
    for (const q of pulses) {
        const before = q.p;
        q.p += q.dir * PULSE_SPEED * pace * dt;
        const lo = Math.min(before, q.p), hi = Math.max(before, q.p);
        for (let n = Math.ceil(lo); n <= Math.floor(hi); n++) {
            if (n !== before) {
                if (n >= 0 && n < maxActiveBlocks) { hit(n, q.s); q.s *= 0.94; }
            }
        }
    }
    pulses = pulses.filter(q => q.s > 0.12 && q.p >= 0 && q.p <= maxActiveBlocks - 1);

    // Sinyal spontan sesekali, supaya jaringan terasa hidup walau tidak disentuh
    ambientT -= dt * Math.max(0.5, pace);
    if (ambientT <= 0) {
        ambientT = rand(2.2, 5);
        spawnPulse(Math.floor(Math.random() * maxActiveBlocks), rand(0.55, 0.8));
    }

    // LAYER BALOK: efek 4 meninggalkan jejak feedback, efek lain dibersihkan penuh
    lctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    lctx.globalCompositeOperation = "source-over";
    lctx.globalAlpha = 1;
    lctx.fillStyle = activeEffect === '4' ? "rgba(204,204,204,0.12)" : "#ccc";
    lctx.fillRect(0, 0, W, H);

    // PROSES ANIMASI BALOK
    for(let i=0; i<maxActiveBlocks; i++){
        const data = blockData[i];

        let cx = data.x;
        let cy = data.y;
        let scale = data.baseScale;
        let rotation = 0;
        let opacity = 1;
        let color = "#ff0000";
        let glowScale = 1;
        let bright = 0;

        const localT = data.tOffset + (isCappedFX ? fxTime : globalTime);

        // --- FILTER ENGINE MATRIX FX KEYPAD ALAT (1-9) ---
        if (activeEffect === '2') {
            if (data !== dragging) {
                data.y += data.driftY * currentSpeed * step;
                data.x += data.driftX * 0.3 * currentSpeed * step;
                if(data.y < -BLOCK) data.y = H + 20;
                if(data.x < -BLOCK) data.x = W; else if (data.x > W) data.x = -BLOCK;
            }
            cx += Math.sin(localT) * 3;
        }
        else if (activeEffect === '3') {
            scale += Math.sin(localT * 2) * 0.25;
        }
        else if (activeEffect === '4') {
            // TRUE FEEDBACK TRAIL (layer tidak dihapus penuh)
            opacity = 0.35;
            cx += Math.sin(localT * 2.5) * 45 * currentSpeed;
            cy += Math.cos(localT * 2.5) * 45 * currentSpeed;
        }
        else if (activeEffect === '5') {
            // ROTATING MATRIX
            rotation = fxTime * 90 * currentSpeed + data.rotOffset;
            color = `hsl(${(fxTime * 40) % 360}, 100%, 45%)`;
            cx += Math.sin(localT) * 3;
            cy += Math.cos(localT) * 3;
        }
        else if (activeEffect === '7') {
            // BLOOMING FEEDBACK EFFECT (Maks Speed 30)
            const bloomFactor = (Math.sin(localT * 3.5) + 1) * 0.5;
            scale += bloomFactor * 1.5 * currentSpeed;
            bright = bloomFactor;
            glowScale = 1 + bloomFactor * 2.5;
            cx += Math.sin(localT) * 15 * bloomFactor * currentSpeed;
            cy += Math.cos(localT) * 15 * bloomFactor * currentSpeed;
        }
        else if (activeEffect === '8') {
            // UNLIMITED INWARD ZOOM BERGILIRAN (STAGGERED TUNNEL)
            const zoomProgress = (globalTime * 0.2 + (i / maxActiveBlocks) * 1.5) % 1.5;
            scale = data.baseScale * (0.2 + zoomProgress * 3);
            if (zoomProgress > 1.2) opacity = 1.0 - ((zoomProgress - 1.2) / 0.3);
            cx += Math.sin(localT) * 1;
        }
        else if (activeEffect === '9') {
            // SOLID ORBITAL VORTEX
            const dx = data.x + BLOCK / 2 - centerX;
            const dy = data.y + BLOCK / 2 - centerY;
            const currentDist = Math.sqrt(dx * dx + dy * dy);
            vortexAngle = fxTime * 0.3 * currentSpeed;
            const currentAngle = Math.atan2(dy, dx) + vortexAngle;
            cx = centerX + Math.cos(currentAngle) * currentDist - BLOCK / 2;
            cy = centerY + Math.sin(currentAngle) * currentDist - BLOCK / 2;
            rotation = currentAngle * (180 / Math.PI);
        }
        else {
            // EFEK 1 & 6 (NORMAL MODE)
            cx += Math.sin(localT) * 2;
            cy += Math.cos(localT) * 2;
        }

        // Reaksi: terdorong pegas, membesar, glow mekar, makin terang
        const r = data.react;
        if (data !== dragging) { cx += data.ox; cy += data.oy; }
        scale *= 1 + r * 0.45;
        glowScale *= 1 + r * 1.3;
        bright = Math.max(bright, r * 0.75);

        const px = cx + BLOCK / 2, py = cy + BLOCK / 2;
        activeCoordinates.push({ x: px, y: py, r });
        data.sx = px; data.sy = py; data.sScale = Math.max(0.05, scale);

        drawBlock(px, py, scale, rotation, opacity, color, glowScale, bright, data === dragging);
    }

    // KOMPOSISI AKHIR
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.drawImage(layer, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // GARIS KONEKSI HIJAU (siku horizontal lalu vertikal, mode difference)
    ctx.globalCompositeOperation = "difference";
    ctx.fillStyle = "#9eeb34";
    ctx.globalAlpha = activeEffect === '6' ? 0.15 : 1;
    for(let i=0; i<activeCoordinates.length - 1; i++){
        const a = activeCoordinates[i];
        const b = activeCoordinates[i+1];
        // garis menebal saat kedua ujungnya sedang bereaksi
        const t = 3 + 7 * Math.min(1, Math.max(a.r, b.r));
        const h = t / 2 - 1.5;
        ctx.fillRect(Math.min(a.x, b.x) - h, a.y - h, Math.abs(a.x - b.x) + t - 3, t);
        ctx.fillRect(b.x - h, Math.min(a.y, b.y) - h, t, Math.abs(a.y - b.y) + t - 3);
    }

    // KEPALA SINYAL: kotak putih yang berjalan di jalur siku garis hijau
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#fff";
    for (const q of pulses) {
        const i = Math.min(Math.floor(q.p), activeCoordinates.length - 2);
        if (i < 0) continue;
        const a = activeCoordinates[i], b = activeCoordinates[i + 1];
        const f = q.p - i;
        const lx = Math.abs(b.x - a.x), ly = Math.abs(b.y - a.y), L = lx + ly || 1;
        const dist = f * L;
        let x, y;
        if (dist <= lx) { x = a.x + Math.sign(b.x - a.x) * dist; y = a.y; }
        else { x = b.x; y = a.y + Math.sign(b.y - a.y) * (dist - lx); }
        const sz = 6 + 10 * q.s;
        ctx.fillRect(x - sz / 2 + 1.5, y - sz / 2 + 1.5, sz, sz);
    }

    // GARIS UNGU (lebar 100px, mode difference)
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ff00ff";
    for (const l of purpleLines) {
        if (l.v) ctx.fillRect(l.pos, 0, 100, H);
        else ctx.fillRect(0, l.pos, W, 100);
    }

    // Kilatan negatif singkat saat struktur dibuat ulang
    if (regenFlash > 0.01) {
        ctx.globalAlpha = regenFlash * 0.85;
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, W, H);
        regenFlash *= Math.pow(0.0005, dt);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(animationEngine);
}

// Balok merah 120px, sudut 4px, glow 140px terpotong di dalam balok (overflow:hidden asli)
function drawBlock(px, py, scale, rotation, opacity, color, glowScale, bright, held){
    if (opacity <= 0.005 || scale <= 0.005) return;
    const c = lctx;
    c.save();
    c.translate(px, py);
    c.rotate(rotation * Math.PI / 180);
    c.scale(scale, scale);
    c.globalAlpha = opacity;
    c.beginPath();
    if (c.roundRect) c.roundRect(-60, -60, 120, 120, 4); else c.rect(-60, -60, 120, 120);
    c.fillStyle = color;
    c.fill();
    c.clip();
    const g = 140 * glowScale;
    c.drawImage(glowSprite, -g / 2, -g / 2, g, g);
    if (bright > 0.02) {
        c.globalCompositeOperation = "lighter";
        c.globalAlpha = opacity * bright * 0.6;
        c.fillStyle = "#fff";
        c.fillRect(-60, -60, 120, 120);
    }
    c.restore();
    if (held) {
        c.save();
        c.translate(px, py); c.rotate(rotation * Math.PI / 180);
        c.strokeStyle = "#000"; c.lineWidth = 2;
        const s = 60 * scale + 6;
        c.strokeRect(-s, -s, s * 2, s * 2);
        c.restore();
    }
}

/* ==========================================
   HUD
   ========================================== */
function updateHud(){
    const currentAct = Math.max(5, Math.min(MAX_POOL, Math.floor(datsVal2)));
    const capped = CAPPED.includes(activeEffect);
    const displaySpeed = capped ? Math.min(30, datsVal1) : datsVal1;
    const lock = datsVal1 > 30 && capped ? ' (LOCKED AT 30)' : '';
    const head = deviceLinked ? 'DATs ALAT OK' : 'DATs STANDALONE';
    hud.innerText = `${head} // FX ${activeEffect}: ${FX_NAMES[activeEffect]} // SPEED_A: ${displaySpeed}${lock} // BLOCKS_B: ${currentAct}`;
    encA.value = datsVal1; encAv.textContent = datsVal1;
    encB.value = currentAct; encBv.textContent = currentAct;
    keypadBtns.forEach(b => b.classList.toggle("on", b.dataset.k === activeEffect));
}

// Satu pintu masuk untuk semua kontrol: alat, panel, dan keyboard
function pressKey(key){
    if (key === "-" || key === "") return;
    if (FX_NAMES[key]) {
        activeEffect = key;
        spawnPulse(Math.floor(Math.random() * activeCount()), 0.9); // ganti efek = jaringan tersentak
    }
    else generateStructure();
    updateHud();
}

/* ==========================================
   PANEL ENCODER VIRTUAL + KEYPAD
   ========================================== */
const keypad = document.getElementById("keypad");
const keypadBtns = [];
for (const k of ['1','2','3','4','5','6','7','8','9','*']) {
    const b = document.createElement("button");
    b.textContent = k === '*' ? '* NEW' : k;
    b.dataset.k = k;
    b.title = k === '*' ? 'Buat ulang struktur' : FX_NAMES[k];
    if (k === '*') b.style.gridColumn = "span 2";
    b.addEventListener("click", e => { e.stopPropagation(); pressKey(k); });
    keypad.appendChild(b);
    keypadBtns.push(b);
}
encA.addEventListener("input", () => { datsVal1 = +encA.value; updateHud(); });
encB.addEventListener("input", () => { datsVal2 = +encB.value; updateHud(); });
for (const el of [panel, document.getElementById("hideBtn")]) {
    el.addEventListener("pointerdown", e => e.stopPropagation());
}

const hideBtn = document.getElementById("hideBtn");
function togglePanel(){
    panel.classList.toggle("hide");
    hideBtn.textContent = panel.classList.contains("hide") ? "[H] PANEL" : "[H] HIDE";
}
hideBtn.addEventListener("click", togglePanel);

window.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" && e.key.startsWith("Arrow")) return;
    const k = e.key;
    if (/^[1-9]$/.test(k)) pressKey(k);
    else if (k === "*" || k === "0" || k === "#" || k === " " || k.toLowerCase() === "r") { e.preventDefault(); pressKey("*"); }
    else if (k.toLowerCase() === "h") togglePanel();
    else if (k === "ArrowRight") { datsVal1 = Math.min(100, datsVal1 + 2); updateHud(); }
    else if (k === "ArrowLeft") { datsVal1 = Math.max(1, datsVal1 - 2); updateHud(); }
    else if (k === "ArrowUp") { datsVal2 = Math.min(MAX_POOL, Math.floor(datsVal2) + 3); updateHud(); }
    else if (k === "ArrowDown") { datsVal2 = Math.max(5, Math.floor(datsVal2) - 3); updateHud(); }
});

/* ==========================================
   SENTUH / MOUSE
   Tap di ruang kosong = buat ulang struktur (perilaku asli).
   Tekan balok lalu geser = pindahkan balok, garis hijau ikut.
   ========================================== */
let downAt = null;
cv.addEventListener("pointerdown", e => {
    cv.setPointerCapture(e.pointerId);
    downAt = { x: e.clientX, y: e.clientY, moved: false };
    const maxActive = Math.max(5, Math.min(MAX_POOL, Math.floor(datsVal2)));
    let best = null, bestD = Infinity;
    for (let i = 0; i < maxActive; i++) {
        const d = blockData[i];
        const half = 60 * d.sScale + 12;
        const dist = Math.hypot(e.clientX - d.sx, e.clientY - d.sy);
        if (Math.abs(e.clientX - d.sx) < half && Math.abs(e.clientY - d.sy) < half && dist < bestD) { best = d; bestD = dist; }
    }
    if (best) {
        dragging = best;
        dragIndex = blockData.indexOf(best);
        best.ox = best.oy = best.vx = best.vy = 0;
        best.react = 1;
        downAt.offX = best.sx - e.clientX;
        downAt.offY = best.sy - e.clientY;
        cv.classList.add("grab");
    }
});
cv.addEventListener("pointermove", e => {
    if (!downAt) return;
    if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) downAt.moved = true;
    if (dragging) {
        // Geser titik dasar balok sebesar pergeseran jari
        const tx = e.clientX + downAt.offX, ty = e.clientY + downAt.offY;
        if (activeEffect === '9') {
            // Efek 9 memutar posisi dasar, jadi putar balik titik jari ke posisi dasar
            const cx = W / 2, cy = H / 2, c = Math.cos(-vortexAngle), s = Math.sin(-vortexAngle);
            const rx = tx - cx, ry = ty - cy;
            dragging.x = cx + rx * c - ry * s - BLOCK / 2;
            dragging.y = cy + rx * s + ry * c - BLOCK / 2;
        } else {
            dragging.x += tx - dragging.sx;
            dragging.y += ty - dragging.sy;
        }
        const mx = tx - dragging.sx, my = ty - dragging.sy;
        dragging.sx = tx; dragging.sy = ty;
        dragging.react = Math.max(dragging.react, 0.8);
        // Tetangga di rantai ikut tertarik, makin jauh makin lemah
        for (let k = 1; k <= 6; k++) {
            const pull = Math.pow(0.62, k);
            for (const j of [dragIndex - k, dragIndex + k]) {
                const n = blockData[j];
                if (!n || j >= activeCount()) continue;
                n.vx += mx * 14 * pull; n.vy += my * 14 * pull;
                n.react = Math.max(n.react, Math.min(1, Math.hypot(mx, my) * 0.05) * pull * 1.6);
            }
        }
    }
});
function endPointer(){
    if (!downAt) return;
    if (!downAt.moved && !dragging) pressKey("*");
    else if (dragging) spawnPulse(dragIndex, downAt.moved ? 0.8 : 1); // tap/lepas balok = kirim sinyal
    downAt = null; dragging = null; dragIndex = -1;
    cv.classList.remove("grab");
}
cv.addEventListener("pointerup", endPointer);
cv.addEventListener("pointercancel", endPointer);

window.addEventListener("resize", resize);

resize();
generateStructure();
if (window.innerWidth <= 560) togglePanel(); // di HP panel disembunyikan dulu, buka lewat tombol
updateHud();
requestAnimationFrame(t => { last = t; animationEngine(t); });

/* ==========================================
   PROSES KONEKSI WEB SERIAL API
   Format dari alat tidak berubah: DS_WEB;<encA>;<encB>;<key>
   ========================================== */
document.getElementById("connectBtn").onclick = async (ev) => {
    ev.stopPropagation();
    if (!("serial" in navigator)) {
        hud.innerText = "WEB SERIAL TIDAK TERSEDIA // BUKA FILE INI LANGSUNG DI CHROME / EDGE DESKTOP";
        return;
    }
    hud.innerText = "MENCOBA MENGHUBUNGKAN ALAT...";
    try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });

        document.getElementById("connectBtn").style.display = "none";
        deviceLinked = true;
        hud.innerText = "DATs COLLECTIBLE LINK OK // MODE ACTIVE";

        const textDecoder = new TextDecoderStream();
        port.readable.pipeTo(textDecoder.writable);
        const reader = textDecoder.readable.getReader();
        let buffer = "";

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            buffer += value;
            const lines = buffer.split("\n");
            buffer = lines.pop();

            for (const line of lines) {
                const cleanLine = line.trim();
                if (cleanLine.startsWith("DS_WEB;")) {
                    const parts = cleanLine.split(";");
                    if (parts.length >= 4) {
                        datsVal1 = parseInt(parts[1]) || 30;
                        datsVal2 = parseInt(parts[2]) || 60;
                        const key = parts[3];
                        if (key !== "-" && key !== "") pressKey(key);
                        updateHud();
                    }
                }
            }
        }
    } catch (err) {
        hud.innerText = "KONEKSI GAGAL! PERIKSA SERIAL MONITOR.";
        if (err && err.name === "SecurityError") {
            hud.innerText = "SERIAL DIBLOKIR DI HALAMAN INI // BUKA FILE LANGSUNG DI CHROME / EDGE";
            return;
        }
        if (err && err.name === "NotFoundError") return; // pengguna menutup dialog pilih port
        alert("🚨 ERROR KONEKSI SERIAL:\n\n1. Pastikan SERIAL MONITOR di Arduino IDE sudah Anda TUTUP.\n2. Pastikan Alat sudah masuk ke cabang Mode C (Tekan C lalu * di keypad).\n3. Pastikan kabel data USB tertancap kuat.");
    }
};
</script>
