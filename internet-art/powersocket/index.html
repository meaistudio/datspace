<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Power Socket</title>
<style>
  /* One full-bleed WebGL scene on black; single look by choice. */
  :root { --void: #000; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--void); overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  :root { padding: 0 !important; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .ui { position: fixed; font: 12px/1.4 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; color: #fff; pointer-events: none; z-index: 2; }
  #hud { top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; display: flex; gap: 28px; transition: opacity .4s;
    font-family: "Press Start 2P", "JetBrains Mono", monospace; font-size: 9px; letter-spacing: .1em; line-height: 1; }
  #hud span { color: #0ff; font-size: 18px; letter-spacing: 0; display: block; margin-top: 8px; }
  #hud .low { color: #f0f; }
  #hud .r { margin-left: auto; text-align: right; }
  .hide { opacity: 0; }
  #bonus { color: #ff0; font-size: 14px; position: absolute; left: 0; top: 100%; opacity: 0; }
  #bonus.go { animation: bon 1s ease-out; }
  @keyframes bon { 0% { opacity: 1; transform: translateY(0) scale(1.4); } 100% { opacity: 0; transform: translateY(-26px) scale(1); } }
  #hud .t { position: relative; }
  #hud .t.hit span:first-child { color: #ff0; }

  /* start menu: minimal CMYK type on a see-through black panel */
  #menu { inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: none; transition: opacity .4s;
    --c: #00ffff; --m: #ff00ff; --y: #ffff00; --k: #000; }
  #menu.hide { visibility: hidden; }
  .crt { pointer-events: auto; width: max-content; max-width: 100%; box-sizing: border-box;
    padding: clamp(22px, 5vw, 40px) clamp(20px, 5vw, 44px);
    background: rgba(0, 0, 0, .78); color: var(--c); letter-spacing: .06em; }
  .crt .row { font-size: clamp(11px, 2.4vw, 13px); color: var(--m); }
  .crt .head { font-size: clamp(16px, 3.8vw, 22px); margin: 0 0 clamp(14px, 3vw, 22px); color: var(--y); font-weight: 800; }
  #items { list-style: none; margin: 0; padding: 0; font-size: clamp(17px, 4.4vw, 26px); line-height: 1.6; font-weight: 800; }
  #items li { cursor: pointer; display: flex; align-items: center; width: max-content; max-width: 100%; }
  #items li .ico { width: 2.6em; height: 1em; flex: none; margin-right: .4em; opacity: 0; }
  #items li.sel { color: var(--y); }
  #items li.sel .ico { opacity: 1; }
  #items li.sel .ico .plug { animation: plugin .35s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes plugin { from { transform: translateX(-14px); } to { transform: none; } }
  #info { font-size: clamp(12px, 2.8vw, 14px); line-height: 1.75; font-weight: 800; }
  #info:empty { display: none; }
  #info + #items { margin-top: 14px; }
  #info b { font-weight: 800; color: var(--k); background: var(--y); padding: 0 .3em; }
  .crt hr { border: 0; border-top: 1px solid var(--m); width: 100%; margin: clamp(16px, 3vw, 22px) 0 clamp(12px, 2.6vw, 16px); }
  .keys { font-size: clamp(11px, 2.6vw, 13px); line-height: 1.7; display: grid; grid-template-columns: auto auto 1fr; column-gap: .6em; }
  .keys span:nth-child(3n+1) { color: var(--y); }
  .keys span:nth-child(3n+2) { color: var(--m); }
  #arrow { left: 0; top: 0; width: 0; height: 0; border-top: 14px solid transparent; border-bottom: 14px solid transparent; border-left: 26px solid #ff0; filter: drop-shadow(2px 2px 0 #f0f); transition: opacity .2s; }
  @media (pointer: coarse) { .keys, .crt hr { display: none; } }
  #toast { left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); color: #ff0; background: rgba(0, 0, 0, .78); padding: 6px 12px; font-weight: 800; opacity: 0; transition: opacity .4s; white-space: nowrap; }
  #toast.on { opacity: 1; }
  #flash { inset: 0; background: #ff0; opacity: 0; mix-blend-mode: screen; }
  #flash.go { animation: fl .35s ease-out; }
  @keyframes fl { from { opacity: .45; } to { opacity: 0; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Press+Start+2P&display=swap">

<div class="ui hide" id="hud">
  <div>score<span id="score">0</span></div>
  <div class="t" id="tbox">time<span id="time">30.0</span><span id="bonus">+6s</span></div>
  <div class="r">best<span id="best">0</span></div>
</div>
<div class="ui" id="menu">
  <div class="crt" role="menu" aria-label="Power Socket menu">
    <div class="head" id="mtitle">MENU</div>
    <div id="info"></div>
    <ul id="items"></ul>
  </div>
</div>
<div class="ui" id="arrow"></div>
<div class="ui" id="flash"></div>
<div class="ui" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MOBILE = matchMedia('(pointer: coarse)').matches;   // phones/tablets: lighter scene, tilt controls
  const CYAN = 0x00ffff, YELLOW = 0xffff00, MAGENTA = 0xff00ff;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, MOBILE ? 1.5 : 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 1);
  (document.body || document.documentElement).appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(74, innerWidth / innerHeight, 0.05, 400);

  // ---------- shared materials (flat, unlit) ----------
  const mat = c => new THREE.MeshBasicMaterial({ color: c, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  const mCyan = mat(CYAN), mYellow = mat(YELLOW), mMagenta = mat(MAGENTA);
  const mMagentaSide = new THREE.MeshBasicMaterial({ color: MAGENTA, side: THREE.DoubleSide });
  // magenta→violet fade like the reference's tinted faces
  const mMagGrad = new THREE.MeshBasicMaterial({ vertexColors: true, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.75 });
  const xrayMat = new THREE.LineBasicMaterial({ color: 0x002a2a, transparent: true, opacity: 0.55, depthTest: false });
  const cableEdge = new THREE.LineBasicMaterial({ color: 0x063c3c, transparent: true, opacity: 0.9 });

  // ---------- geometry ----------
  const box = new THREE.BoxGeometry(1, 1, 1);
  const boxEdges = new THREE.EdgesGeometry(box);
  const boxGrad = box.clone();
  {
    const col = [], c1 = new THREE.Color(MAGENTA), c2 = new THREE.Color(0x9a3cff), pos = boxGrad.attributes.position;
    for (let i = 0; i < pos.count; i++) { const c = c1.clone().lerp(c2, (pos.getY(i) + 0.5)); col.push(c.r, c.g, c.b); }
    boxGrad.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  }
  const holeR = 0.3;
  const disc = new THREE.CircleGeometry(holeR, 8);
  const crescent = new THREE.RingGeometry(holeR * 0.8, holeR * 1.05, 8, 1, Math.PI * 1.05, Math.PI * 0.9);
  const recess = new THREE.EdgesGeometry(new THREE.CylinderGeometry(holeR, holeR * 0.9, 0.45, 8, 2, true).rotateX(Math.PI / 2));
  const holePins = new THREE.EdgesGeometry(new THREE.BoxGeometry(0.06, 0.06, 0.35));

  const plugBody = new THREE.CylinderGeometry(0.3, 0.3, 0.5, 8, 1).rotateX(Math.PI / 2).rotateZ(Math.PI / 8);
  const plugBodyEdges = new THREE.EdgesGeometry(new THREE.CylinderGeometry(0.3, 0.3, 0.5, 8, 3).rotateX(Math.PI / 2).rotateZ(Math.PI / 8), 1);
  const plugBand = new THREE.CylinderGeometry(0.305, 0.305, 0.06, 8, 1, true).rotateX(Math.PI / 2).rotateZ(Math.PI / 8);
  const pinGeo = new THREE.BoxGeometry(0.05, 0.05, 0.38);
  const pinEdges = new THREE.EdgesGeometry(pinGeo);
  const CABLE = 160;
  const cableGeo = new THREE.CylinderGeometry(0.055, 0.055, CABLE, 8, 1, true).rotateX(Math.PI / 2);
  const cableEdges = new THREE.EdgesGeometry(cableGeo, 1);
  const stripeGeo = new THREE.BoxGeometry(0.022, 0.022, CABLE);
  const STUB = 0.7;
  const stubGeo = new THREE.CylinderGeometry(0.055, 0.055, STUB, 8, 1, true).rotateX(Math.PI / 2);
  const stubEdges = new THREE.EdgesGeometry(stubGeo, 1);
  const kneeGeo = new THREE.SphereGeometry(0.058, 8, 4);

  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

  function makeUnit(i) {
    const unit = new THREE.Group();
    const s = rnd() < 0.18 ? 1.35 + rnd() * 0.5 : 0.85 + rnd() * 0.35;

    // socket box: face order +x -x +y -y +z(front) -z
    const front = rnd() < 0.55 ? mYellow : mCyan;
    const faces = [mCyan, mYellow, mCyan, mYellow, front, mCyan];
    if (rnd() < 0.5) faces[rnd() < 0.5 ? 0 : 2] = mYellow;
    const magenta = rnd() < 0.2;
    const sock = new THREE.Group(); sock.scale.setScalar(s); unit.add(sock);
    const cube = new THREE.Mesh(magenta ? boxGrad : box, magenta ? faces.map((m, k) => k === (rnd() < 0.5 ? 1 : 4) ? mMagGrad : m) : faces);
    sock.add(cube);
    sock.add(new THREE.LineSegments(boxEdges, edgeMat));
    // socket opening on the front face
    const d = new THREE.Mesh(disc, front === mYellow ? mCyan : mYellow); d.position.z = 0.502; sock.add(d);
    const cr = new THREE.Mesh(crescent, mMagentaSide); cr.position.z = 0.504; sock.add(cr);
    const rc = new THREE.LineSegments(recess, xrayMat); rc.position.z = 0.3; sock.add(rc);
    for (const x of [-0.1, 0.1]) { const p = new THREE.LineSegments(holePins, xrayMat); p.position.set(x, 0, 0.25); sock.add(p); }

    // plug, always square to the socket so its pins line up with the holes;
    // only the cable bends away, along local direction `dir`
    const plug = new THREE.Group(); plug.scale.setScalar(s);
    const bodyMats = [mYellow, mCyan, mCyan];
    if (rnd() < 0.3) bodyMats[0] = mCyan;
    const body = new THREE.Mesh(plugBody, bodyMats); body.position.z = 0.25; plug.add(body);
    const be = new THREE.LineSegments(plugBodyEdges, xrayMat); be.position.z = 0.25; plug.add(be);
    const band = new THREE.Mesh(plugBand, mMagentaSide); band.position.z = 0.08; plug.add(band);
    for (const x of [-0.1, 0.1]) {
      const p = new THREE.Mesh(pinGeo, mCyan); p.position.set(x, 0, -0.19); plug.add(p);
      const pe = new THREE.LineSegments(pinEdges, edgeMat); pe.position.copy(p.position); plug.add(pe);
    }
    const stub = new THREE.Mesh(stubGeo, mCyan); stub.position.z = 0.5 + STUB / 2; plug.add(stub);
    const se = new THREE.LineSegments(stubEdges, cableEdge); se.position.copy(stub.position); plug.add(se);
    const knee = new THREE.Mesh(kneeGeo, mCyan); knee.position.z = 0.5 + STUB; plug.add(knee);
    const dir = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, 0).multiplyScalar(2.2).add(new THREE.Vector3(0, 0, 1)).normalize();
    const lead = new THREE.Group(); lead.position.z = 0.5 + STUB;
    lead.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
    const cable = new THREE.Mesh(cableGeo, mCyan); cable.position.z = CABLE / 2; lead.add(cable);
    const ce = new THREE.LineSegments(cableEdges, cableEdge); ce.position.copy(cable.position); lead.add(ce);
    const st = new THREE.Mesh(stripeGeo, rnd() < 0.6 ? mYellow : mMagenta); st.position.set(0.05, 0.015, cable.position.z); lead.add(st);
    plug.add(lead);
    unit.add(plug);

    unit.userData = { s, plug, state: rnd() < 0.5 ? 1 : 0, gap: 0, next: rnd() * 6 };
    return unit;
  }

  const N = MOBILE ? 44 : 60;
  const units = [];
  for (let i = 0; i < N; i++) { const u = makeUnit(i); scene.add(u); units.push(u); }

  // ---------- formations: all built around the vertical axis ----------
  const Z = new THREE.Vector3(0, 0, 1);
  const face = (p, n, roll = 0) => {
    const q = new THREE.Quaternion().setFromUnitVectors(Z, n.clone().normalize());
    q.multiply(new THREE.Quaternion().setFromAxisAngle(Z, roll));
    return { p, q };
  };
  const hash = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
  const F = {
    // two intertwined strands climbing a column
    helix(i) {
      const strand = i % 2, t = Math.floor(i / 2) / (N / 2);
      const a = t * Math.PI * 5 + strand * Math.PI, r = 1.7, y = (t - 0.5) * 34;
      const p = new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r);
      return face(p, new THREE.Vector3(Math.cos(a), (hash(i, 1) - 0.5) * 0.8, Math.sin(a)), hash(i, 2) * 3);
    },
    // a spiral tunnel the camera can look down
    tunnel(i) {
      const a = i * 0.55, r = 3.2 + Math.sin(i * 0.3) * 0.4, y = (i / N - 0.5) * 40;
      const p = new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r);
      return face(p, new THREE.Vector3(-Math.cos(a), 0.15, -Math.sin(a)), a);
    },
    // one long diagonal chain
    chain(i) {
      const t = i / (N - 1) - 0.5, dir = new THREE.Vector3(0.55, 0.75, -0.35).normalize();
      const p = dir.clone().multiplyScalar(t * 52).add(new THREE.Vector3(Math.sin(i * 0.9) * 0.6, 0, Math.cos(i * 0.9) * 0.6));
      return face(p, new THREE.Vector3(hash(i, 3) - 0.5, -0.4, 1), hash(i, 4) * 6);
    },
    // trunk splitting into branches
    branch(i) {
      const b = i % 4, t = Math.floor(i / 4) / (N / 4);
      const dirs = [[0, 1, 0], [0.8, 0.9, 0.3], [-0.7, 0.8, -0.4], [0.2, 0.7, -0.9]];
      const d = new THREE.Vector3(...dirs[b]).normalize();
      const base = new THREE.Vector3(0, -14, 0);
      const p = b === 0 ? base.clone().add(d.clone().multiplyScalar(t * 30)) :
        base.clone().add(new THREE.Vector3(0, 12, 0)).add(d.clone().multiplyScalar(t * 18));
      p.x += Math.sin(t * 9 + b) * 0.8; p.z += Math.cos(t * 7 + b) * 0.8;
      return face(p, new THREE.Vector3(hash(i, 5) - 0.5, -0.6, hash(i, 6) - 0.5).add(new THREE.Vector3(p.x, 0, p.z).normalize()), hash(i, 7) * 6);
    },
    // a sweeping overhead arch, faces turned down
    arch(i) {
      const t = i / (N - 1), a = t * Math.PI;
      const p = new THREE.Vector3(Math.cos(a) * 14, Math.sin(a) * 12 - 4, (hash(i, 8) - 0.5) * 6);
      return face(p, new THREE.Vector3(-Math.cos(a) * 0.5, -1, hash(i, 9) - 0.5), hash(i, 10) * 6);
    },
    // loose cloud
    swarm(i) {
      const u = hash(i, 11), v = hash(i, 12), r = 3 + hash(i, 13) * 9;
      const th = u * Math.PI * 2, ph = Math.acos(2 * v - 1);
      const p = new THREE.Vector3(Math.sin(ph) * Math.cos(th) * r, Math.cos(ph) * r * 1.4, Math.sin(ph) * Math.sin(th) * r);
      return face(p, p.clone().normalize(), hash(i, 14) * 6);
    }
  };
  const order = ['helix', 'chain', 'tunnel', 'branch', 'arch', 'swarm'];

  // ---------- camera shots: each a function of time, blended continuously ----------
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const SHOTS = [
    // low, looking up the column while circling
    t => ({ p: V(Math.cos(t * 0.12) * 9, -17, Math.sin(t * 0.12) * 9), l: V(0, 6, 0), up: V(0, 1, 0) }),
    // close side sweep, rising and falling
    t => ({ p: V(Math.cos(t * 0.09 + 1) * 6.5, Math.sin(t * 0.07) * 8, Math.sin(t * 0.09 + 1) * 6.5), l: V(0, Math.sin(t * 0.07) * 8 + 3, 0), up: V(0, 1, 0) }),
    // inside the axis, looking straight up, slowly rolling
    t => ({ p: V(0.4, -22, 0.4), l: V(0, 20, 0), up: V(Math.cos(t * 0.15), 0, Math.sin(t * 0.15)) }),
    // under the arch, wide and low
    t => ({ p: V(Math.sin(t * 0.08) * 5, -10, 10 + Math.cos(t * 0.08) * 3), l: V(0, 4, -2), up: V(0, 1, 0) }),
    // far diagonal, looking across
    t => ({ p: V(16 * Math.cos(t * 0.05 + 2), 8, 16 * Math.sin(t * 0.05 + 2)), l: V(0, -2, 0), up: V(0, 1, 0) })
  ];
  const SHOT_FOR = [0, 4, 2, 0, 3, 1];

  let fi = 0, morph = 1, from = [], to = [], sinceSwitch = 0;
  let shotA = SHOT_FOR[0], shotB = SHOT_FOR[0], camBlend = 1;
  const HOLD = 7, MORPH = 4, CAMBLEND = 5;

  const snap = name => units.map((_, i) => F[name](i));
  function goTo(next) {
    from = units.map(u => ({ p: u.position.clone(), q: u.quaternion.clone() }));
    fi = next; to = snap(order[fi]); morph = 0; sinceSwitch = 0;
    if (G.mode === 'play') return;         // the chase cam stays put mid-game
    shotA = shotB; shotB = SHOT_FOR[fi]; camBlend = 0;
  }
  to = snap(order[0]);
  units.forEach((u, i) => { u.position.copy(to[i].p); u.quaternion.copy(to[i].q); });

  // ---------- game ----------
  const $ = id => document.getElementById(id);
  const hud = $('hud'), scoreEl = $('score'), timeEl = $('time'), bestEl = $('best');
  const menu = $('menu'), mtitle = $('mtitle'), info = $('info'), itemsEl = $('items'), pointerArrow = $('arrow'), flash = $('flash');
  const bonusEl = $('bonus'), tbox = $('tbox');
  let best = 0;
  try { best = +localStorage.getItem('ps-best') || 0; } catch (e) {}
  bestEl.textContent = best;

  // the player's plug: pins forward (-z), cable trailing back (+z)
  const player = new THREE.Group();
  {
    const body = new THREE.Mesh(plugBody, [mYellow, mCyan, mCyan]); body.position.z = 0.25; player.add(body);
    const be = new THREE.LineSegments(plugBodyEdges, edgeMat); be.position.z = 0.25; player.add(be);
    const band = new THREE.Mesh(plugBand, mMagentaSide); band.position.z = 0.08; player.add(band);
    for (const x of [-0.1, 0.1]) {
      const p = new THREE.Mesh(pinGeo, mCyan); p.position.set(x, 0, -0.19); player.add(p);
      const pe = new THREE.LineSegments(pinEdges, edgeMat); pe.position.copy(p.position); player.add(pe);
    }
    const cable = new THREE.Mesh(cableGeo, mCyan); cable.position.z = 0.5 + CABLE / 2; player.add(cable);
    const ce = new THREE.LineSegments(cableEdges, cableEdge); ce.position.copy(cable.position); player.add(ce);
    const st = new THREE.Mesh(stripeGeo, mMagenta); st.position.set(0.05, 0.015, cable.position.z); player.add(st);
    player.scale.setScalar(1.3);
  }
  player.visible = false;
  scene.add(player);

  // pulsing white cage around the socket you must hit
  const cage = new THREE.LineSegments(boxEdges, new THREE.LineBasicMaterial({ color: 0xffffff, depthTest: false, transparent: true }));
  cage.renderOrder = 10;
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.5, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, depthTest: false, transparent: true }));
  ring.renderOrder = 10;

  // spark burst on a successful plug-in
  const SPARKS = 80;
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(SPARKS * 3), 3));
  const sparkVel = Array.from({ length: SPARKS }, () => new THREE.Vector3());
  const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ color: 0xffff00, size: 0.18, transparent: true, depthTest: false }));
  sparks.renderOrder = 11; sparks.visible = false; scene.add(sparks);
  let sparkLife = 0;
  function burst(at) {
    const pos = sparkGeo.attributes.position;
    for (let i = 0; i < SPARKS; i++) {
      pos.setXYZ(i, at.x, at.y, at.z);
      sparkVel[i].set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(4 + Math.random() * 10);
    }
    pos.needsUpdate = true; sparkLife = 1; sparks.visible = true;
    sparks.material.color.setHex([0xffff00, 0x00ffff, 0xff00ff][Math.floor(Math.random() * 3)]);
  }

  const G = { mode: 'menu', score: 0, time: 0, target: null, yaw: 0, pitch: 0, boost: false };
  const steer = { x: 0, y: 0, keyX: 0, keyY: 0, touching: false };
  const fwd = new THREE.Vector3(), tmp = new THREE.Vector3(), tip = new THREE.Vector3();
  const qPlayer = new THREE.Quaternion(), eul = new THREE.Euler(0, 0, 0, 'YXZ');
  const START_TIME = 40, BONUS = 6, SPEED = 7;
  // flight orientation (no visual bank); free quaternion so loops are possible
  G.q = new THREE.Quaternion(); G.sx = 0; G.sy = 0;
  const chaseUp = new THREE.Vector3(0, 1, 0), qd = new THREE.Quaternion(), ed = new THREE.Euler(0, 0, 0, 'YXZ');
  const vR = new THREE.Vector3(), vU = new THREE.Vector3(), vA = new THREE.Vector3(), Zax = new THREE.Vector3(0, 0, 1);
  function turnToward(dir, amount) {
    // rotate the flight frame a fraction of the way toward a world direction
    vA.set(0, 0, -1).applyQuaternion(G.q);
    const ang = Math.acos(Math.max(-1, Math.min(1, vA.dot(dir))));
    if (ang < 1e-4) return;

    if (G.mode === 'play') { if (e.code === 'Escape') pause(); return; }
    // menu navigation
    if (e.code === 'ArrowUp' || e.code === 'KeyW') { sfx.tick(); select(sel - 1); }
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') { sfx.tick(); select(sel + 1); }
    else if (['ArrowRight', 'Enter', 'Space', 'KeyD'].includes(e.code)) { if (!e.repeat) { sfx.select(); menuItems[sel][1](); } }
    else if (e.code === 'Escape' || e.code === 'ArrowLeft') {
      if (G.mode === 'pause') resume();
      else if (screen === 'howto' || screen === 'score') showMenu('main');
    }
  });
  addEventListener('keyup', e => { keys[e.code] = false; });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.fov = camera.aspect < 0.8 ? 92 : 74;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  dispatchEvent(new Event('resize'));

  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const smooth = t => t * t * (3 - 2 * t);
  let clock = 0, prev = performance.now();
  const qT = new THREE.Quaternion(), look = new THREE.Vector3(), upV = new THREE.Vector3();
  const chasePos = new THREE.Vector3(), chaseLook = new THREE.Vector3();
  const proj = new THREE.Vector3();

  const dockPos = new THREE.Vector3(), nrm = new THREE.Vector3();
  function updateDock(dt) {
    const D = G.dock, u = D.u, d = u.userData;
    D.t += dt;
    nrm.set(0, 0, 1).applyQuaternion(u.quaternion);
    dockPos.copy(u.position).addScaledVector(nrm, d.s / 2);
    const k = D.t < 0.35 ? 0.3 : 1;
    player.position.lerp(dockPos, k);
    player.quaternion.slerp(u.quaternion, k);   // pins point straight into the socket
    player.scale.setScalar(THREE.MathUtils.lerp(player.scale.x, d.s, k));
    fwd.copy(nrm).negate();
    if (!D.paid && player.position.distanceTo(dockPos) < 0.05) {
      // seated: now it counts
      D.paid = true; G.score++; G.time += BONUS;
      sfx.plug();
      burst(dockPos);
      flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
      bonusEl.classList.remove('go'); void bonusEl.offsetWidth; bonusEl.classList.add('go');
      tbox.classList.add('hit'); setTimeout(() => tbox.classList.remove('hit'), 600);
      scoreEl.textContent = G.score; timeEl.textContent = G.time.toFixed(1);
    }
    if (D.paid && D.t > 0.8) {
      // pull out and fly away along the socket's axis
      G.q.setFromUnitVectors(vA.set(0, 0, -1), nrm);
      player.position.addScaledVector(nrm, 0.8);
      G.dock = null;
      if (G.score % 3 === 0) goTo((fi + 1) % order.length);   // the formation reshuffles
      pickTarget();
    }
  }

  function updatePlayer(dt) {
    if (G.dock) { updateDock(dt); return; }
    player.scale.setScalar(THREE.MathUtils.lerp(player.scale.x, 1.3, 0.1));
    const kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    const ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    const dz = v => Math.abs(v) < (MOBILE ? 0.12 : 0.08) ? 0 : v;   // dead zone in the middle
    const tx = tilt.active ? tilt.x : steer.x, ty = tilt.active ? tilt.y : steer.y;
    // smooth the input; phones get heavier smoothing and gentler rates
    const sm = 1 - Math.pow(MOBILE ? 0.0015 : 0.00001, dt);
    G.sx += ((kx || dz(tx)) - G.sx) * sm; G.sy += ((ky || dz(ty)) - G.sy) * sm;
    const curve = v => Math.sign(v) * Math.pow(Math.abs(v), MOBILE ? 1.25 : 0.75);
    const rate = MOBILE ? 0.72 : 1;
    // yaw and pitch in the plug's own frame: keep pulling up and it loops right over
    ed.set(-curve(G.sy) * 3.1 * rate * dt, -curve(G.sx) * 3.8 * rate * dt, 0); qd.setFromEuler(ed);
    G.q.multiply(qd);
    // level the wings again whenever not flying near-vertical
    vA.set(0, 0, -1).applyQuaternion(G.q); vR.set(1, 0, 0).applyQuaternion(G.q); vU.set(0, 1, 0).applyQuaternion(G.q);
    // (skipped while pulling hard, so holding up flies a full loop)
    if (Math.abs(vA.y) < 0.8 && Math.abs(G.sy) < 0.3) {
      const roll = Math.atan2(vR.y, vU.y);
      qd.setFromAxisAngle(Zax, -roll * Math.min(1, 2.2 * dt)); G.q.multiply(qd);
    }
    // gentle aim assist when the target is close and roughly ahead
    if (G.target) {
      frontOf(G.target, tmp); tmp.sub(player.position);
      const dist = tmp.length(); tmp.normalize();
      if (dist < 12 && vA.dot(tmp) > 0.82) turnToward(tmp, Math.min(1, 2.2 * dt));
    }
    // soft wall: drift back toward the formation when straying too far
    if (player.position.length() > 38) turnToward(tmp.copy(player.position).negate().normalize(), Math.min(1, 1.5 * dt));
    G.q.normalize();
    qPlayer.copy(G.q).multiply(qd.setFromAxisAngle(Zax, -G.sx * 0.5));   // visual bank into the turn
    player.quaternion.slerp(qPlayer, 0.35);
    fwd.set(0, 0, -1).applyQuaternion(player.quaternion);
    const boosting = G.boost || keys.Space || keys.ShiftLeft;
    if (boosting !== G.wasBoost) { G.wasBoost = boosting; sfx.boost(boosting); }
    player.position.addScaledVector(fwd, SPEED * (boosting ? 2 : 1) * dt);

    // plugged in?
    tip.copy(fwd).multiplyScalar(0.5).add(player.position);
    const u = G.target;
    if (u) {
      frontOf(u, tmp);
      if (tip.distanceTo(tmp) < 1.1 + u.userData.s * 0.45) {
        G.dock = { u, t: 0, paid: false };     // slide the plug square into the holes
      }
    }
    G.time -= dt;
    if (G.time <= 0) { G.time = 0; endGame(); }
    scoreEl.textContent = G.score;
    timeEl.textContent = G.time.toFixed(1);
    timeEl.classList.toggle('low', G.time < 6);
  }

  function updateArrow() {
    if (G.mode !== 'play' || !G.target) { pointerArrow.style.opacity = 0; return; }
    frontOf(G.target, proj);
    proj.project(camera);
    const behind = proj.z > 1;
    let x = proj.x, y = proj.y;
    if (behind) { x = -x; y = -y; }
    const on = !behind && Math.abs(x) < 0.92 && Math.abs(y) < 0.88;
    if (on) { pointerArrow.style.opacity = 0; return; }
    const m = Math.max(Math.abs(x) / 0.9, Math.abs(y) / 0.85) || 1;
    x /= m; y /= m;
    const px = (x + 1) / 2 * innerWidth, py = (1 - y) / 2 * innerHeight;
    const ang = Math.atan2(-y, x);
    pointerArrow.style.opacity = 1;
    pointerArrow.style.transform = `translate(${px}px,${py}px) translate(-50%,-50%) rotate(${ang}rad)`;
  }

  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - prev) / 1000)); prev = now; clock += dt; sinceSwitch += dt;

    const inGame = G.mode === 'play' || G.mode === 'pause';
    if (!inGame && morph >= 1 && sinceSwitch > HOLD) goTo((fi + 1) % order.length);
    if (morph < 1) {
      morph = Math.min(1, morph + dt / (reduce ? 0.01 : MORPH));
      units.forEach((u, i) => {
        const k = ease(Math.max(0, Math.min(1, morph * 1.5 - (i / N) * 0.5)));
        u.position.lerpVectors(from[i].p, to[i].p, k);
        qT.copy(from[i].q).slerp(to[i].q, k); u.quaternion.copy(qT);
      });
    } else if (!reduce) {
      units.forEach((u, i) => { u.position.y = to[i].p.y + Math.sin(clock * 0.9 + i * 0.5) * 0.12; });
    }

    units.forEach(u => {
      const d = u.userData;
      d.next -= dt;
      if (d.next <= 0) { d.state = d.state ? 0 : 1; d.next = 2 + Math.random() * 6; }
      const want = (d.state && !d.forced) ? 0 : 1.6 + d.s;
      d.gap += (want - d.gap) * (reduce ? 1 : 0.035);
      d.plug.position.set(0, 0, d.s / 2 + d.gap);
    });

    if (G.mode === 'play') updatePlayer(dt);

    // target pulse
    const pulse = 0.5 + 0.5 * Math.sin(clock * 8);
    cage.material.opacity = 0.5 + pulse * 0.5;
    ring.scale.setScalar(1 + pulse * 0.5); ring.material.opacity = 1 - pulse * 0.6;

    // sparks
    if (sparkLife > 0) {
      sparkLife -= dt * 1.6;
      const pos = sparkGeo.attributes.position;
      for (let i = 0; i < SPARKS; i++) {
        sparkVel[i].multiplyScalar(0.94);
        pos.setXYZ(i, pos.getX(i) + sparkVel[i].x * dt, pos.getY(i) + sparkVel[i].y * dt, pos.getZ(i) + sparkVel[i].z * dt);
      }
      pos.needsUpdate = true;
      sparks.material.opacity = Math.max(0, sparkLife);
      if (sparkLife <= 0) sparks.visible = false;
    }

    // camera: cinematic shots in menus, a chase cam while playing, always blended
    camBlend = Math.min(1, camBlend + dt / (reduce ? 0.01 : (inGame ? 2 : CAMBLEND)));
    const k = smooth(camBlend);
    if (inGame) {
      tmp.set(0, 1.3, 4.6).applyQuaternion(G.q).add(player.position);
      chaseUp.lerp(vU.set(0, 1, 0).applyQuaternion(G.q), k < 1 ? 1 : 0.1).normalize();
      chasePos.lerp(tmp, k < 1 ? 1 : 0.12);
      chaseLook.copy(fwd).multiplyScalar(8).add(player.position);
      const A = SHOTS[shotA](clock);
      camera.position.lerpVectors(A.p, chasePos, k);
      look.lerpVectors(A.l, chaseLook, k);
      upV.lerpVectors(A.up, chaseUp, k).normalize();
    } else {
      const A = SHOTS[shotA](clock), B = SHOTS[shotB](clock);
      camera.position.lerpVectors(player.visible ? chasePos : A.p, B.p, k);
      look.lerpVectors(player.visible ? chaseLook : A.l, B.l, k);
      upV.lerpVectors(player.visible ? chaseUp : A.up, B.up, k).normalize();
      if (camBlend >= 1) { player.visible = false; shotA = shotB; }
    }
    camera.up.copy(upV);
    camera.lookAt(look);

    renderer.render(scene, camera);
    updateArrow();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
