<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Arrow Dodge</title>
<style>
  /* One full-bleed canvas game on black; single dark look by choice. */
  :root { --void: #050506; --ink: #fff; --dim: rgba(255, 255, 255, .45); color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--void); overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  :root { padding: 0 !important; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
  .ui { position: fixed; font: 12px/1.4 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); pointer-events: none; z-index: 2; }
  #hud { mix-blend-mode: difference; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; display: flex; gap: 28px; transition: opacity .4s;
    font-family: "Press Start 2P", "JetBrains Mono", monospace; font-size: 9px; letter-spacing: .1em; line-height: 1; color: var(--dim); }
  #hud span { color: var(--ink); font-size: 18px; letter-spacing: 0; display: block; margin-top: 8px; }
  #hud .r { margin-left: auto; text-align: right; }
  #hud .hit span { animation: hitflash .5s steps(2) 3; }
  @keyframes hitflash { 50% { opacity: 0; } }
  #plus { position: absolute; left: 0; top: 100%; font-size: 12px; color: var(--ink); opacity: 0; margin-top: 6px; }
  #plus.go { animation: plus .8s ease-out; }
  @keyframes plus { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-18px); } }
  .s { position: relative; }
  .hide { opacity: 0; }

  /* minimal menu on a see-through black panel */
  #menu { inset: 0; display: grid; place-items: center; padding: 16px; transition: opacity .4s; }
  #menu.hide { visibility: hidden; }
  .panel { pointer-events: auto; width: max-content; max-width: 100%; box-sizing: border-box;
    padding: clamp(22px, 5vw, 40px) clamp(20px, 5vw, 44px); background: rgba(0, 0, 0, .72); letter-spacing: .06em; }
  .panel .head { font-size: clamp(16px, 3.8vw, 22px); margin: 0 0 clamp(14px, 3vw, 22px); font-weight: 800; }
  #items { list-style: none; margin: 0; padding: 0; font-size: clamp(17px, 4.4vw, 26px); line-height: 1.6; font-weight: 800; }
  #items li { cursor: pointer; display: flex; align-items: center; width: max-content; max-width: 100%; color: var(--dim); }
  #items li .ico { width: 1.5em; height: .9em; flex: none; margin-right: .4em; opacity: 0; }
  #items li.sel { color: var(--ink); }
  #items li.sel .ico { opacity: 1; animation: nudge .6s ease-in-out infinite alternate; }
  @keyframes nudge { from { transform: translateX(-4px); } to { transform: translateX(2px); } }
  #info { font-size: clamp(12px, 2.8vw, 14px); line-height: 1.75; font-weight: 800; }
  #info:empty { display: none; }
  #info + #items { margin-top: 14px; }
  #info b { font-weight: 800; color: #000; background: var(--ink); padding: 0 .3em; }
  #flash { inset: 0; background: #fff; opacity: 0; mix-blend-mode: difference; }
  #flash.go { animation: fl .3s ease-out; }
  @keyframes fl { from { opacity: .9; } to { opacity: 0; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Press+Start+2P&display=swap">

<canvas id="c"></canvas>
<div class="ui hide" id="hud">
  <div class="s">score<span id="score">0</span><span id="plus">+10</span></div>
  <div id="livesBox">lives<span id="lives">&#9632;&#9632;&#9632;</span></div>
  <div class="r">best<span id="best">0</span></div>
</div>
<div class="ui" id="menu">
  <div class="panel" role="menu" aria-label="Arrow Dodge menu">
    <div class="head" id="mtitle">MENU</div>
    <div id="info"></div>
    <ul id="items"></ul>
  </div>
</div>
<div class="ui" id="flash"></div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MOBILE = matchMedia('(pointer: coarse)').matches;
  const $ = id => document.getElementById(id);

  // ---------- sound: a generative 'random modular' patch + synth SFX ----------
  const audio = (() => {
    let ctx = null, master, musicBus, musicFilter, sfxBus, noiseBuf, delay, boostGain, nextTime = 0, step = 0, timer = null;
    let on = true;
    try { on = localStorage.getItem('ps-sound') !== 'off'; } catch (e) {}
    const BPM = 116, S16 = 60 / BPM / 4;
    // everything is quantized to a minor pentatonic (+9) over a root that wanders
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const SCALE = [0, 3, 5, 7, 10, 12, 14, 15, 17, 19, 22, 24, 26, 27];
    const ROOTS = [50, 48, 53, 45, 55, 51];        // D, C, F, A, G, Eb
    let rootM = 50;
    const q = (v, oct = 0) => mtof(rootM + oct * 12 + SCALE[Math.min(SCALE.length - 1, Math.floor(v * SCALE.length))]);
    // "Turing machine" style shift registers: random values that loop and slowly mutate
    const rnd = Math.random;
    const regA = Array.from({ length: 16 }, rnd), regB = Array.from({ length: 16 }, rnd);
    let lenA = 8, lenB = 5, mutA = 0.08, dens = 0.7, ratio = 2, pingRot = 0, hatRot = 0;
    const euclid = (k, n, i) => ((i % n) * k) % n < k;   // k hits spread evenly over n steps

    function init() {
      if (ctx) { if (on && ctx.state !== 'running') wake(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = on ? 0.8 : 0;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
      master.connect(comp); comp.connect(ctx.destination);
      musicFilter = ctx.createBiquadFilter(); musicFilter.type = 'lowpass'; musicFilter.frequency.value = 900; musicFilter.Q.value = 0.7;
      musicBus = ctx.createGain(); musicBus.gain.value = 0.55;
      musicBus.connect(musicFilter); musicFilter.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
      // tape-ish echo whose time gets re-patched now and then
      delay = ctx.createDelay(2); delay.delayTime.value = S16 * 3;
      const fb = ctx.createGain(); fb.gain.value = 0.38;
      const dl = ctx.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 2600;
      delay.connect(dl); dl.connect(fb); fb.connect(delay); dl.connect(musicBus);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // continuous whoosh for the boost
      const wn = noise(); wn.loop = true;
      const wf = ctx.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 900; wf.Q.value = 0.8;
      boostGain = ctx.createGain(); boostGain.gain.value = 0;
      wn.connect(wf); wf.connect(boostGain); boostGain.connect(sfxBus); wn.start();
      // motion drone: detuned saws through a resonant lowpass that opens with your speed
      droneF = ctx.createBiquadFilter(); droneF.type = 'lowpass'; droneF.Q.value = 9; droneF.frequency.value = 200;
      droneG = ctx.createGain(); droneG.gain.value = 0;
      droneOsc = [-9, 9, 1200].map(det => {
        const o = ctx.createOscillator(); o.type = det === 1200 ? 'square' : 'sawtooth'; o.detune.value = det;
        o.frequency.value = chord[0] / 2; o.connect(droneF); o.start(); return o;
      });
      const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 5.4; lg.gain.value = 120;
      lfo.connect(lg); lg.connect(droneF.frequency); lfo.start();
      droneF.connect(droneG); droneG.connect(sfxBus); droneG.connect(delay);
      shaper = ctx.createWaveShaper();
      const curve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 4); }
      shaper.curve = curve; shaper.connect(sfxBus);
      nextTime = ctx.currentTime + 0.1;
      timer = setInterval(schedule, 25);
      if (!on) ctx.suspend();
    }
    let chord = [0, 3, 7, 10, 14].map(i => mtof(50 + i)), droneF = null, droneG = null, droneOsc = [], shaper = null, lockN = 0;
    function setChord(r) {
      chord = [0, 3, 7, 10, 14].map(i => mtof(r + i));
      if (ctx) droneOsc.forEach(o => o.frequency.setTargetAtTime(chord[0] / 2, ctx.currentTime, 0.12));
    }
    function noise() { const n = ctx.createBufferSource(); n.buffer = noiseBuf; return n; }
    function env(g, t, peak, a, dcy) {
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + dcy);
    }

    // ---- modules ----
    function out(node, pan) {
      if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; node.connect(p); p.connect(musicBus); return p; }
      node.connect(musicBus); return node;
    }
    // west-coast FM voice through a low-pass gate: the "bongo" pluck of a Buchla-ish patch
    function lpgPluck(t, hz, bright, len, pan = 0, echo = 0.35) {
      const car = ctx.createOscillator(), mod = ctx.createOscillator(), mg = ctx.createGain(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      mod.frequency.value = hz * ratio; car.frequency.value = hz;
      mg.gain.setValueAtTime(hz * (1 + bright * 6), t); mg.gain.exponentialRampToValueAtTime(hz * 0.05 + 1, t + len * 0.7);
      f.type = 'lowpass'; f.Q.value = 1.5;
      f.frequency.setValueAtTime(600 + bright * 7000, t); f.frequency.exponentialRampToValueAtTime(140, t + len);
      env(g, t, 0.16, 0.002, len);
      mod.connect(mg); mg.connect(car.frequency); car.connect(f); f.connect(g);
      out(g, pan); if (echo) { const e = ctx.createGain(); e.gain.value = echo; g.connect(e); e.connect(delay); }
      car.start(t); mod.start(t); car.stop(t + len + 0.05); mod.stop(t + len + 0.05);
    }
    // high resonant square bleep, sometimes ratcheted
    function bleep(t, hz, len, pan) {
      const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = hz;
      f.type = 'bandpass'; f.Q.value = 12; f.frequency.setValueAtTime(hz * 3, t); f.frequency.exponentialRampToValueAtTime(hz, t + len);
      env(g, t, 0.09, 0.001, len); o.connect(f); f.connect(g); out(g, pan); g.connect(delay);
      o.start(t); o.stop(t + len + 0.03);
    }
    // slow gliding sub/triangle bass
    function drone(t, hz, len) {
      const o = ctx.createOscillator(), o2 = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = 'triangle'; o2.type = 'sawtooth'; o.frequency.value = hz; o2.frequency.value = hz; o2.detune.value = 7;
      f.type = 'lowpass'; f.Q.value = 5; f.frequency.setValueAtTime(180, t); f.frequency.linearRampToValueAtTime(500 + rnd() * 900, t + len * 0.4); f.frequency.linearRampToValueAtTime(160, t + len);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(f); o2.connect(f); f.connect(g); out(g, 0); o.start(t); o2.start(t); o.stop(t + len + 0.05); o2.stop(t + len + 0.05);
    }
    // ring-modulated metal ping
    function ping(t, hz, pan) {
      const a = ctx.createOscillator(), b = ctx.createOscillator(), rm = ctx.createGain(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      a.type = 'square'; b.type = 'square'; a.frequency.value = hz; b.frequency.value = hz * 1.414;
      rm.gain.value = 0; a.connect(rm); b.connect(rm.gain);
      f.type = 'bandpass'; f.frequency.value = hz * 2.5; f.Q.value = 6;
      env(g, t, 0.12, 0.001, 0.12); rm.connect(f); f.connect(g); out(g, pan); g.connect(delay);
      a.start(t); b.start(t); a.stop(t + 0.16); b.stop(t + 0.16);
    }
    function tick(t, v, pan) {
      const n = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = 'highpass'; f.frequency.value = 6000 + rnd() * 3000;
      env(g, t, 0.1 * v, 0.001, 0.02 + rnd() * 0.03); n.connect(f); f.connect(g); out(g, pan); n.start(t); n.stop(t + 0.08);
    }
    function thud(t, v) {
      const o = ctx.createOscillator(), g = ctx.createGain(), hz = 70 + rnd() * 40;
      o.frequency.setValueAtTime(hz * 2.2, t); o.frequency.exponentialRampToValueAtTime(hz * 0.6, t + 0.14);
      env(g, t, 0.55 * v, 0.002, 0.22); o.connect(g); out(g, 0); o.start(t); o.stop(t + 0.3);
    }

    // one switch for the whole engine: suspended = silent and nothing queues up
    let gen = 0;
    function wake() {
      const my = ++gen;
      ctx.resume().then(() => {
        if (my !== gen) return;
        nextTime = ctx.currentTime + 0.06;       // restart the loop from now, never replay missed steps
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(0.0001, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0.8, ctx.currentTime + 0.15);
      });
    }
    function sleep() {
      const my = ++gen;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(0, ctx.currentTime, 0.03);
      setTimeout(() => { if (my === gen) ctx.suspend(); }, 150);
    }
    function schedule() {
      if (ctx.state !== 'running' || !on) return;
      // a throttled timer (background tab, busy frame) must not dump a pile of late notes at once
      if (nextTime < ctx.currentTime - 0.05) nextTime = ctx.currentTime + 0.05;
      while (nextTime < ctx.currentTime + 0.12) { playStep(step, nextTime); nextTime += S16; step++; }
    }
    function playStep(s, t) {
      // every 32 steps the patch gets re-knobbed: new lengths, ratio, density, sometimes a new root
      if (s % 32 === 0) {
        lenA = [5, 7, 8, 8, 11, 13, 16][Math.floor(rnd() * 7)]; lenB = [3, 5, 6, 7][Math.floor(rnd() * 4)];
        ratio = [0.5, 1, 1.5, 2, 2.01, 3.5][Math.floor(rnd() * 6)];
        dens = 0.45 + rnd() * 0.5; mutA = rnd() < 0.3 ? 0.25 : 0.06;
        pingRot = Math.floor(rnd() * 16); hatRot = Math.floor(rnd() * 16);
        if (s % 128 === 0 && s > 0) rootM = ROOTS[Math.floor(rnd() * ROOTS.length)];
        const r = rootM;
        setTimeout(() => setChord(r), Math.max(0, (t - ctx.currentTime) * 1000));
        delay.delayTime.setTargetAtTime(S16 * [2, 3, 3, 5][Math.floor(rnd() * 4)], t, 0.5);
      }
      const jit = () => (rnd() - 0.5) * 0.012;            // a little analog clock slop
      // A: the main sequence
      const ia = s % lenA, va = regA[ia];
      if (rnd() < mutA) regA[ia] = rnd();
      if (va > 1 - dens) lpgPluck(t + jit(), q(va, -1), (va * 3) % 1, S16 * (1.5 + (va * 7) % 3), (va - 0.5) * 1.2);
      // B: sparse high bleeps, sometimes ratcheted
      const ib = s % lenB, vb = regB[ib];
      if (rnd() < 0.1) regB[ib] = rnd();
      if (vb > 0.72 && rnd() < dens) {
        const reps = rnd() < 0.25 ? 2 + Math.floor(rnd() * 3) : 1;
        for (let k = 0; k < reps; k++) bleep(t + k * S16 / reps, q(vb, 1), S16 * 0.8 / reps, (rnd() - 0.5) * 1.6);
      }
      // C: bass that moves rarely
      if (s % 16 === 0 || (s % 16 === 10 && rnd() < 0.4)) drone(t, mtof(rootM - 24 + (rnd() < 0.3 ? 7 : 0)), S16 * (6 + rnd() * 6));
      // percussion on rotated euclidean rhythms
      if (euclid(3, 8, s)) thud(t, s % 16 === 0 ? 1 : 0.6);
      if (euclid(5, 16, s + pingRot) && rnd() < dens + 0.2) ping(t + jit(), q(regB[(s + 3) % 16], 1), (rnd() - 0.5) * 1.4);
      if (euclid(7, 16, s + hatRot) || rnd() < 0.15) tick(t + jit(), 0.4 + rnd() * 0.6, (rnd() - 0.5) * 1.8);
    }

    // ---- sound effects ----
    function thump(t, from, to, v, len) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(from, t); o.frequency.exponentialRampToValueAtTime(to, t + len);
      env(g, t, v, 0.002, len); o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + len + 0.05);
    }
    function click(t, v, hp = 2500, len = 0.03) {
      const n = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      f.type = 'highpass'; f.frequency.value = hp;
      env(g, t, v, 0.0005, len); n.connect(f); f.connect(g); g.connect(sfxBus); n.start(t); n.stop(t + len + 0.02);
    }
    const live = () => ctx && on && ctx.state === 'running';
    // one analog-style voice: two detuned oscillators -> resonant lowpass sweep -> envelope
    function synth(t, hz, o = {}) {
      const dur = o.dur || 0.2, g = ctx.createGain(), f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.Q.value = o.q || 8;
      f.frequency.setValueAtTime(o.cut0 || 4000, t); f.frequency.exponentialRampToValueAtTime(o.cut1 || 300, t + dur);
      env(g, t, o.peak || 0.12, o.att || 0.003, dur);
      for (const det of o.det || [-8, 8]) {
        const v = ctx.createOscillator(); v.type = o.type || 'sawtooth'; v.detune.value = det;
        v.frequency.setValueAtTime(hz, t);
        if (o.glide) v.frequency.exponentialRampToValueAtTime(o.glide, t + (o.glideT || dur));
        v.connect(f); v.start(t); v.stop(t + dur + 0.05);
      }
      f.connect(g); g.connect(o.dist ? shaper : sfxBus);
      if (o.echo) { const e = ctx.createGain(); e.gain.value = o.echo; g.connect(e); e.connect(delay); }
    }
    const sfx = {
      // laser zap: pitch dives as the arrow leaves the grid
      launch() {
        if (!live()) return; const t = ctx.currentTime;
        synth(t, chord[4] * 4, { glide: chord[0] / 2, glideT: 0.2, dur: 0.24, cut0: 7000, cut1: 400, q: 12, peak: 0.13, type: 'square', det: [-15, 15], echo: 0.25 });
        click(t, 0.12, 4000, 0.04);
      },
      // lock-on: resonant plucks that climb the current chord, one note per arrow
      lock() {
        if (!live()) return; const t = ctx.currentTime, hz = chord[lockN++ % 5] * 2;
        synth(t, hz, { dur: 0.16, cut0: 5200, cut1: 500, q: 14, peak: 0.1, echo: 0.45 });
        synth(t + 0.08, hz * 2, { dur: 0.1, cut0: 4000, cut1: 600, q: 10, peak: 0.05, type: 'square', det: [0] });
      },
      // hit: a distorted detuned chord stab that bends down
      hit() {
        if (!live()) return; const t = ctx.currentTime;
        [0, 2, 4].forEach(i => synth(t, chord[i], { glide: chord[i] * 0.5, glideT: 0.35, dur: 0.45, cut0: 3000, cut1: 120, q: 6, peak: 0.16, det: [-25, 25], dist: true }));
        thump(t, 120, 36, 0.9, 0.3); click(t, 0.4, 400, 0.08);
      },
      // ring: a fast rising arpeggio with echo
      collect() {
        if (!live()) return; const t = ctx.currentTime;
        [0, 2, 4, 3, 4].forEach((n, i) => synth(t + i * 0.045, chord[n] * 4 * (i === 4 ? 2 : 1),
          { dur: 0.14, cut0: 6000, cut1: 900, q: 6, peak: 0.07, type: 'square', det: [-6, 6], echo: 0.5 }));
      },
      // speed 0..1 opens the drone filter and raises its level
      motion(v) {
        if (!ctx || !droneG) return; const t = ctx.currentTime;
        droneG.gain.setTargetAtTime(live() ? v * 0.07 : 0, t, 0.08);
        droneF.frequency.setTargetAtTime(180 + v * v * 2600, t, 0.06);
      },
      // the plug seating: pins scrape, a solid clunk, then the mains hum + a spark
      plug() {
        if (!live()) return; const t = ctx.currentTime;
        click(t, 0.35, 1800, 0.05);
        click(t + 0.045, 0.9, 1200, 0.03);
        thump(t + 0.045, 190, 55, 0.9, 0.16);
        const h = ctx.createOscillator(), h2 = ctx.createOscillator(), hg = ctx.createGain(), hf = ctx.createBiquadFilter();
        h.type = 'sawtooth'; h.frequency.value = 100; h2.type = 'square'; h2.frequency.value = 50;
        hf.type = 'lowpass'; hf.frequency.value = 900;
        hg.gain.setValueAtTime(0.0001, t + 0.06); hg.gain.exponentialRampToValueAtTime(0.16, t + 0.09); hg.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
        h.connect(hf); h2.connect(hf); hf.connect(hg); hg.connect(sfxBus);
        h.start(t + 0.06); h2.start(t + 0.06); h.stop(t + 0.6); h2.stop(t + 0.6);
        const z = ctx.createOscillator(), zg = ctx.createGain(); z.type = 'square';
        z.frequency.setValueAtTime(500, t + 0.07); z.frequency.exponentialRampToValueAtTime(2400, t + 0.2);
        env(zg, t + 0.07, 0.07, 0.003, 0.14); z.connect(zg); zg.connect(sfxBus); z.start(t + 0.07); z.stop(t + 0.25);

    }

  }
